<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Page | I Record Memories</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        .detail-hero {
            --hero-image: linear-gradient(135deg, #284a2e, #111111);
            align-items: end;
            background:
                linear-gradient(180deg, rgba(0, 0, 0, 0.08) 0%, rgba(0, 0, 0, 0.72) 100%),
                var(--hero-image),
                linear-gradient(135deg, #284a2e, #111111);
            background-position: center;
            background-size: cover;
            color: #ffffff;
            display: flex;
            min-height: min(74vh, 720px);
            padding: 112px 0 4rem;
            position: relative;
        }

        .detail-hero.bucket {
            background:
                linear-gradient(180deg, rgba(0, 0, 0, 0.18) 0%, rgba(0, 0, 0, 0.72) 100%),
                repeating-linear-gradient(45deg, #202420 0 12px, #293029 12px 24px);
        }

        .back-link {
            align-items: center;
            color: rgba(255, 255, 255, 0.9);
            display: inline-flex;
            font-size: 0.9rem;
            gap: 0.35rem;
            margin-bottom: 1.25rem;
            text-decoration: none;
        }

        .back-link:hover {
            color: #ffffff;
        }

        .detail-kicker {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .detail-title {
            font-size: clamp(3rem, 10vw, 7rem);
            line-height: 0.95;
            max-width: 960px;
        }

        .detail-subtitle {
            color: rgba(255, 255, 255, 0.84);
            font-size: clamp(1rem, 3vw, 1.2rem);
            line-height: 1.7;
            max-width: 640px;
        }

        .gallery-section {
            background: var(--bg-color);
            padding: 4rem 0;
        }

        .gallery-heading {
            align-items: end;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 0.85rem;
        }

        .gallery-heading p {
            color: var(--text-muted);
            margin: 0;
        }

        .gallery-masonry {
            column-count: 1;
            column-gap: 1rem;
        }

        @media (min-width: 700px) {
            .gallery-masonry {
                column-count: 2;
            }
        }

        @media (min-width: 1100px) {
            .gallery-masonry {
                column-count: 3;
            }
        }

        .media-tile {
            background: #000000;
            border: 0;
            border-radius: 8px;
            cursor: zoom-in;
            display: block;
            margin: 0 0 1rem;
            overflow: hidden;
            padding: 0;
            position: relative;
            width: 100%;
        }

        .media-tile img,
        .media-tile video {
            display: block;
            height: auto;
            max-height: 720px;
            min-height: 230px;
            object-fit: cover;
            transition: filter 0.25s ease, transform 0.35s ease;
            width: 100%;
        }

        .media-tile:hover img,
        .media-tile:hover video {
            filter: brightness(0.9);
            transform: scale(1.025);
        }

        .video-marker {
            align-items: center;
            background: rgba(0, 0, 0, 0.54);
            border-radius: 999px;
            color: #ffffff;
            display: flex;
            height: 44px;
            justify-content: center;
            left: 50%;
            pointer-events: none;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
        }

        .bucket-panel {
            align-items: center;
            background:
                linear-gradient(135deg, transparent 0 48%, rgba(107, 114, 128, 0.16) 48% 52%, transparent 52% 100%),
                linear-gradient(45deg, transparent 0 48%, rgba(107, 114, 128, 0.12) 48% 52%, transparent 52% 100%),
                var(--light-gray);
            border: 1px dashed rgba(107, 114, 128, 0.5);
            border-radius: 8px;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            min-height: 320px;
            padding: 2rem;
            text-align: center;
        }

        .bucket-panel strong {
            color: var(--text-color);
            display: block;
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 6vw, 3rem);
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        .lightbox {
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            inset: 0;
            justify-content: center;
            padding: 1rem;
            position: fixed;
            z-index: 2000;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox-media {
            align-items: center;
            display: flex;
            justify-content: center;
            max-height: 90vh;
            max-width: min(1040px, 88vw);
        }

        .lightbox-media img,
        .lightbox-media video {
            border-radius: 8px;
            max-height: 90vh;
            max-width: 100%;
            object-fit: contain;
        }

        .lightbox-btn {
            align-items: center;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 999px;
            color: #ffffff;
            display: flex;
            height: 44px;
            justify-content: center;
            position: fixed;
            transition: background 0.25s ease, transform 0.25s ease;
            width: 44px;
        }

        .lightbox-btn:hover,
        .lightbox-btn:focus-visible {
            background: rgba(255, 255, 255, 0.24);
            outline: none;
            transform: scale(1.04);
        }

        .lightbox-close {
            right: 1.25rem;
            top: 1.25rem;
        }

        .lightbox-prev {
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
        }

        .lightbox-next {
            right: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
        }

        @media (max-width: 768px) {
            .detail-hero {
                min-height: 62vh;
                padding: 96px 0 2.5rem;
            }

            .gallery-section {
                padding: 2.5rem 0;
            }

            .gallery-heading {
                align-items: start;
                flex-direction: column;
                gap: 0.35rem;
            }

            .media-tile img,
            .media-tile video {
                min-height: 180px;
            }

            .lightbox-media {
                max-width: 100%;
            }

            .lightbox-prev,
            .lightbox-next {
                bottom: 1.25rem;
                top: auto;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top glass-nav scrolled">
        <div class="container">
            <a class="navbar-brand font-playfair" href="index.html">Arshvir.</a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="ph ph-list fs-2 text-theme"></i>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center gap-3">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="states.html">States & UT</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                    <li class="nav-item">
                        <button id="theme-toggle" class="btn btn-link nav-link shadow-none" aria-label="Toggle Dark Mode">
                            <i class="ph ph-moon fs-4 text-theme"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <section id="detail-hero" class="detail-hero">
            <div class="container" data-aos="fade-up">
                <a class="back-link" href="states.html"><i class="ph ph-arrow-left"></i> Back to all places</a>
                <p id="place-type" class="detail-kicker mb-3">Loading</p>
                <h1 id="place-title" class="detail-title font-playfair mb-4">Memory Page</h1>
                <p id="place-subtitle" class="detail-subtitle mb-0">Loading memories...</p>
            </div>
        </section>

        <section class="gallery-section">
            <div class="container">
                <div class="gallery-heading">
                    <div>
                        <p class="detail-kicker mb-2">Memory feed</p>
                        <h2 id="gallery-title" class="font-playfair mb-0">Photos and videos</h2>
                    </div>
                    <p id="gallery-count">0 memories</p>
                </div>
                <div id="gallery-content"></div>
            </div>
        </section>
    </main>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Memory viewer">
        <button class="lightbox-btn lightbox-close" type="button" aria-label="Close viewer">
            <i class="ph ph-x fs-4"></i>
        </button>
        <button class="lightbox-btn lightbox-prev" type="button" aria-label="Previous media">
            <i class="ph ph-caret-left fs-4"></i>
        </button>
        <div id="lightbox-media" class="lightbox-media"></div>
        <button class="lightbox-btn lightbox-next" type="button" aria-label="Next media">
            <i class="ph ph-caret-right fs-4"></i>
        </button>
    </div>

    <footer class="footer py-5 text-center border-top">
        <div class="container">
            <h5 class="font-playfair mb-3 text-theme">I Record Memories.</h5>
            <p class="text-muted small mb-4">Made with love by Arshvir</p>
            <div class="social-links gap-4 d-flex justify-content-center">
            <a href="https://www.instagram.com/avarshvir/" target="_blank" aria-label="Instagram"><i class="ph ph-instagram-logo fs-3"></i></a>
                <a href="https://www.youtube.com/@avarshvir" target="_blank" aria-label="YouTube"><i class="ph ph-youtube-logo fs-3"></i></a>
                <a href="https://github.com/avarshvir" target="_blank" aria-label="GitHub"><i class="ph ph-github-logo fs-3"></i></a>
                <a href="https://in.linkedin.com/in/arshvir-995a91203" target="_blank" aria-label="LinkedIn"><i class="ph ph-linkedin-logo fs-3"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        const hero = document.getElementById("detail-hero");
        const placeType = document.getElementById("place-type");
        const placeTitle = document.getElementById("place-title");
        const placeSubtitle = document.getElementById("place-subtitle");
        const galleryTitle = document.getElementById("gallery-title");
        const galleryCount = document.getElementById("gallery-count");
        const galleryContent = document.getElementById("gallery-content");
        const lightbox = document.getElementById("lightbox");
        const lightboxMedia = document.getElementById("lightbox-media");
        const closeBtn = document.querySelector(".lightbox-close");
        const prevBtn = document.querySelector(".lightbox-prev");
        const nextBtn = document.querySelector(".lightbox-next");

        let activeMedia = [];
        let activeIndex = 0;

        async function boot() {
            try {
                const params = new URLSearchParams(window.location.search);
                const id = params.get("id");
                const response = await fetch("data.json", { cache: "no-store" });

                if (!response.ok) {
                    throw new Error("Could not load data.json");
                }

                const data = await response.json();
                const place = data.places.find((item) => item.id === id);

                if (!place) {
                    renderMissing();
                    return;
                }

                renderPlace(place);
            } catch (error) {
                renderError();
                console.error(error);
            }
        }

        function renderPlace(place) {
            const placeKind = place.type === "ut" ? "Union Territory" : "State";
            const mediaLabel = place.media.length === 1 ? "memory" : "memories";

            document.title = `${place.name} | I Record Memories`;
            placeType.textContent = place.visited ? `Visited ${placeKind}` : `${placeKind} Bucket List`;
            placeTitle.textContent = place.name;
            galleryTitle.textContent = place.visited ? `${place.name} memories` : "Bucket list";
            galleryCount.textContent = place.visited ? `${place.media.length} ${mediaLabel}` : "Empty box";

            if (place.cover) {
                hero.style.setProperty("--hero-image", `url('${place.cover}')`);
            } else {
                hero.classList.add("bucket");
            }

            if (!place.media.length) {
                placeSubtitle.textContent = `${place.name} is on the bucket list. Add photos or videos in data.json after the trip.`;
                galleryContent.innerHTML = `
                    <div class="bucket-panel">
                        <div>
                            <strong>Bucket List</strong>
                            <p class="mb-0">${place.name} is waiting for its first memory.</p>
                        </div>
                    </div>
                `;
                return;
            }

            activeMedia = place.media;
            placeSubtitle.textContent = `Memories in ${place.name}.`;
            galleryContent.className = "gallery-masonry";
            galleryContent.innerHTML = place.media.map((item, index) => createMediaTile(item, index)).join("");

            document.querySelectorAll(".media-tile").forEach((tile) => {
                tile.addEventListener("click", () => openLightbox(Number(tile.dataset.index)));
            });
        }

        function renderMissing() {
            hero.classList.add("bucket");
            placeType.textContent = "Not found";
            placeTitle.textContent = "Place not found";
            placeSubtitle.textContent = "Go back to the States & UT page and choose a card from the list.";
            galleryTitle.textContent = "No memories";
            galleryCount.textContent = "0 memories";
            galleryContent.innerHTML = `
                <div class="bucket-panel">
                    <div>
                        <strong>Nothing here</strong>
                        <p class="mb-0">This place link does not match data.json.</p>
                    </div>
                </div>
            `;
        }

        function renderError() {
            hero.classList.add("bucket");
            placeType.textContent = "Data error";
            placeTitle.textContent = "Could not load";
            placeSubtitle.textContent = "Please run this page from a local server such as VS Code Live Server.";
            galleryTitle.textContent = "No memories";
            galleryCount.textContent = "0 memories";
            galleryContent.innerHTML = `
                <div class="bucket-panel">
                    <div>
                        <strong>data.json missing</strong>
                        <p class="mb-0">The detail page needs data.json to render this place.</p>
                    </div>
                </div>
            `;
        }

        function createMediaTile(item, index) {
            if (item.type === "video") {
                return `
                    <button class="media-tile" type="button" data-index="${index}" aria-label="Open video ${index + 1}">
                        <video muted playsinline preload="metadata" poster="${item.poster || ""}">
                            <source src="${item.src}" type="video/mp4">
                        </video>
                        <span class="video-marker"><i class="ph ph-play fs-5"></i></span>
                    </button>
                `;
            }

            return `
                <button class="media-tile" type="button" data-index="${index}" aria-label="Open image ${index + 1}">
                    <img src="${item.src}" alt="${item.alt || "Travel memory"}" loading="lazy">
                </button>
            `;
        }

        function openLightbox(index) {
            activeIndex = index;
            renderLightboxMedia();
            lightbox.classList.add("open");
            document.body.style.overflow = "hidden";
        }

        function renderLightboxMedia() {
            const item = activeMedia[activeIndex];

            if (!item) {
                return;
            }

            if (item.type === "video") {
                lightboxMedia.innerHTML = `
                    <video controls autoplay playsinline poster="${item.poster || ""}">
                        <source src="${item.src}" type="video/mp4">
                    </video>
                `;
            } else {
                lightboxMedia.innerHTML = `<img src="${item.src}" alt="${item.alt || "Travel memory"}">`;
            }
        }

        function closeLightbox() {
            lightbox.classList.remove("open");
            lightboxMedia.innerHTML = "";
            document.body.style.overflow = "";
        }

        function showNext() {
            if (!activeMedia.length) {
                return;
            }

            activeIndex = (activeIndex + 1) % activeMedia.length;
            renderLightboxMedia();
        }

        function showPrevious() {
            if (!activeMedia.length) {
                return;
            }

            activeIndex = (activeIndex - 1 + activeMedia.length) % activeMedia.length;
            renderLightboxMedia();
        }

        closeBtn.addEventListener("click", closeLightbox);
        nextBtn.addEventListener("click", showNext);
        prevBtn.addEventListener("click", showPrevious);
        lightbox.addEventListener("click", (event) => {
            if (event.target === lightbox) {
                closeLightbox();
            }
        });
        document.addEventListener("keydown", (event) => {
            if (!lightbox.classList.contains("open")) {
                return;
            }

            if (event.key === "Escape") {
                closeLightbox();
            }

            if (event.key === "ArrowRight") {
                showNext();
            }

            if (event.key === "ArrowLeft") {
                showPrevious();
            }
        });

        boot();
    </script>
</body>
</html>
