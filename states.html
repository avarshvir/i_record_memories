<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>States & UT | I Record Memories</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        .states-shell {
            min-height: 100vh;
            padding-top: 112px;
            background:
                radial-gradient(circle at 18% 8%, rgba(40, 74, 46, 0.10), transparent 28rem),
                linear-gradient(180deg, var(--bg-color) 0%, var(--warm-beige) 48%, var(--bg-color) 100%);
        }

        .states-kicker {
            color: var(--primary-green);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .states-title {
            font-size: clamp(2.5rem, 6vw, 5.5rem);
            line-height: 0.98;
            max-width: 820px;
        }

        .states-copy {
            color: var(--text-muted);
            font-size: 1.04rem;
            line-height: 1.8;
            max-width: 650px;
        }

        .memory-stats {
            display: grid;
            gap: 0.75rem;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            max-width: 520px;
        }

        .memory-stat {
            border: 1px solid var(--border-color);
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            padding: 1rem;
            border-radius: 8px;
        }

        .memory-stat strong {
            display: block;
            font-size: 1.5rem;
            line-height: 1;
        }

        .memory-stat span {
            color: var(--text-muted);
            display: block;
            font-size: 0.78rem;
            margin-top: 0.35rem;
            text-transform: uppercase;
        }

        .section-heading {
            align-items: end;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 0.85rem;
        }

        .section-heading p {
            color: var(--text-muted);
            margin: 0;
        }

        .places-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        }

        .place-card {
            aspect-ratio: 4 / 5;
            background: var(--light-gray);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #ffffff;
            cursor: pointer;
            isolation: isolate;
            display: block;
            min-height: 260px;
            overflow: hidden;
            padding: 0;
            position: relative;
            text-align: left;
            text-decoration: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
            width: 100%;
        }

        .place-card:hover,
        .place-card:focus-visible {
            border-color: rgba(40, 74, 46, 0.5);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.14);
            outline: none;
            transform: translateY(-4px);
        }

        .place-card.has-media::before {
            background-image: var(--cover);
            background-position: center;
            background-size: cover;
            content: "";
            inset: 0;
            position: absolute;
            transform: scale(1.01);
            transition: transform 0.55s ease, filter 0.35s ease;
            z-index: -2;
        }

        .place-card.has-media:hover::before {
            filter: saturate(1.12);
            transform: scale(1.08);
        }

        .place-card.has-media::after {
            background: linear-gradient(180deg, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.18) 36%, rgba(0,0,0,0.76) 100%);
            content: "";
            inset: 0;
            position: absolute;
            z-index: -1;
        }

        .place-card.bucket-card {
            color: var(--text-color);
        }

        .place-card.bucket-card::before {
            background:
                linear-gradient(135deg, transparent 0 48%, rgba(107, 114, 128, 0.16) 48% 52%, transparent 52% 100%),
                linear-gradient(45deg, transparent 0 48%, rgba(107, 114, 128, 0.12) 48% 52%, transparent 52% 100%);
            background-color: var(--bg-color);
            content: "";
            inset: 0;
            position: absolute;
            z-index: -2;
        }

        .place-card.bucket-card::after {
            border: 1px dashed rgba(107, 114, 128, 0.45);
            border-radius: 8px;
            content: "";
            inset: 0.75rem;
            pointer-events: none;
            position: absolute;
        }

        .place-card-inner {
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
            padding: 1.1rem;
        }

        .place-chip {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            color: #ffffff;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            padding: 0.35rem 0.65rem;
            text-transform: uppercase;
        }

        .bucket-card .place-chip {
            background: transparent;
            border-color: rgba(107, 114, 128, 0.4);
            color: var(--text-muted);
        }

        .place-name {
            display: block;
            font-size: clamp(1.2rem, 3vw, 1.65rem);
            line-height: 1.1;
            margin: 0;
        }

        .place-meta {
            color: rgba(255, 255, 255, 0.82);
            display: block;
            font-size: 0.84rem;
            margin: 0.45rem 0 0;
        }

        .bucket-card .place-meta {
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .states-shell {
                padding-top: 92px;
            }

            .memory-stats {
                grid-template-columns: 1fr;
            }

            .section-heading {
                align-items: start;
                flex-direction: column;
                gap: 0.35rem;
            }

            .places-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .place-card {
                min-height: 220px;
            }
        }

        @media (max-width: 480px) {
            .places-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top glass-nav scrolled">
        <div class="container">
            <a class="navbar-brand font-playfair" href="index.html">Arshvir.</a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="ph ph-list fs-2 text-theme"></i>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center gap-3">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="states.html">States & UT</a></li>
                    <li class="nav-item">
                        <button id="theme-toggle" class="btn btn-link nav-link shadow-none" aria-label="Toggle Dark Mode">
                            <i class="ph ph-moon fs-4 text-theme"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <section class="states-shell">
            <div class="container pb-5">
                <div class="row align-items-end g-4 mb-5">
                    <div class="col-lg-7" data-aos="fade-up">
                        <p class="states-kicker mb-3">India memories, A to Z</p>
                        <h1 class="states-title font-playfair mb-4">States and Union Territories</h1>
                        <p class="states-copy mb-0">GIVING UP IS NOT IN THE BLOOD.</p>
                    </div>
                    <div class="col-lg-5 d-lg-flex justify-content-lg-end" data-aos="fade-up" data-aos-delay="100">
                        <div class="memory-stats">
                            <div class="memory-stat">
                                <strong id="visited-count">0</strong>
                                <span>Visited</span>
                            </div>
                            <div class="memory-stat">
                                <strong id="bucket-count">0</strong>
                                <span>Bucket List</span>
                            </div>
                            <div class="memory-stat">
                                <strong id="total-count">0</strong>
                                <span>Total</span>
                            </div>
                        </div>
                    </div>
                </div>

                <section class="mb-5" aria-labelledby="states-heading">
                    <div class="section-heading">
                        <div>
                            <p class="states-kicker mb-2">A to Z</p>
                            <h2 id="states-heading" class="font-playfair mb-0">Places</h2>
                        </div>
                        <p id="places-count">36 places</p>
                    </div>
                    <div id="states-grid" class="places-grid"></div>
                </section>
            </div>
        </section>

    </main>

    <footer class="footer py-5 text-center border-top">
        <div class="container">
            <h5 class="font-playfair mb-3 text-theme">I Record Memories.</h5>
            <p class="text-muted small mb-4">Made with love by Arshvir</p>
            <div class="social-links gap-4 d-flex justify-content-center">
            <a href="https://www.instagram.com/avarshvir/" target="_blank" aria-label="Instagram"><i class="ph ph-instagram-logo fs-3"></i></a>
                <a href="https://www.youtube.com/@avarshvir" target="_blank" aria-label="YouTube"><i class="ph ph-youtube-logo fs-3"></i></a>
                <a href="https://github.com/avarshvir" target="_blank" aria-label="GitHub"><i class="ph ph-github-logo fs-3"></i></a>
                <a href="https://in.linkedin.com/in/arshvir-995a91203" target="_blank" aria-label="LinkedIn"><i class="ph ph-linkedin-logo fs-3"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        const stateGrid = document.getElementById("states-grid");
        async function boot() {
            try {
                const response = await fetch("data.json", { cache: "no-store" });

                if (!response.ok) {
                    throw new Error("Could not load data.json");
                }

                const data = await response.json();
                renderPlaces(data.places);
            } catch (error) {
                stateGrid.innerHTML = "<p class=\"text-muted\">Could not load data.json. Please run this page from a local server such as VS Code Live Server.</p>";
                console.error(error);
            }
        }

        function renderPlaces(places) {
            const sortedPlaces = [...places].sort(sortVisitedFirst);
            const visited = sortedPlaces.filter((place) => place.visited);

            document.getElementById("visited-count").textContent = visited.length;
            document.getElementById("bucket-count").textContent = sortedPlaces.length - visited.length;
            document.getElementById("total-count").textContent = sortedPlaces.length;
            document.getElementById("places-count").textContent = `${sortedPlaces.length} places`;

            stateGrid.innerHTML = sortedPlaces.map(createCard).join("");
        }

        function sortVisitedFirst(a, b) {
            if (a.visited !== b.visited) {
                return a.visited ? -1 : 1;
            }

            return a.name.localeCompare(b.name);
        }

        function createCard(place) {
            const hasCover = place.visited && place.cover;
            const classes = hasCover ? "place-card has-media" : "place-card bucket-card";
            const coverStyle = hasCover ? `style="--cover: url('${place.cover}')"` : "";
            const chip = place.visited ? "Visited" : "Bucket List";
            const meta = place.visited ? `${place.media.length} memories` : "Empty box";
            const displayName = place.shortName ? `${place.shortName} / ${place.name}` : place.name;

            return `
                <a class="${classes}" ${coverStyle} href="state.html?id=${encodeURIComponent(place.id)}" aria-label="Open ${place.name}">
                    <span class="place-card-inner">
                        <span class="place-chip">${chip}</span>
                        <span>
                            <span class="place-name font-playfair">${displayName}</span>
                            <span class="place-meta">${meta}</span>
                        </span>
                    </span>
                </a>
            `;
        }

        boot();
    </script>
</body>
</html>
